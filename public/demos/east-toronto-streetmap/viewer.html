                        // ---------- Sticky tooltip on focus / hover (ported from the terminal map) ----------
                        // Shows the focused or hovered feature's name in a pill above it.
                        // Sticky: stays until Esc or another feature replaces it, so
                        // screen-magnifier users can pan/zoom to read it.
                        function setupTooltip() {
                            const tooltip = document.getElementById('poiTooltip');
                            const map = document.querySelector('#map');
                            if (!tooltip || !map) return;
                            const tooltipTitle = tooltip.querySelector('.poi-tooltip-title');
                            const marker = document.getElementById('poiMarker');
                            let current = null;  // the feature whose name is currently shown

                            // Place the pill at a viewport point (the mouse pointer, or a tap), in
                            // its own fixed layer. Anchoring to the pointer's client coords — not the
                            // feature's geometry — keeps it with the cursor whatever the map's zoom:
                            // clientX/clientY and position:fixed share the same coordinate space.
                            function positionAt(x, y) {
                                // Marker pins the EXACT point (never clamped, constant size).
                                if (marker) { marker.style.left = x + 'px'; marker.style.top = y + 'px'; }
                                const margin = 8;
                                const placeBelow = (y - 4) - (tooltip.offsetHeight + 14) < margin;
                                document.body.classList.toggle('tooltip-below', placeBelow);
                                const tipW = tooltip.offsetWidth;
                                let left = x;
                                if (left - tipW / 2 < margin) left = tipW / 2 + margin;
                                if (left + tipW / 2 > window.innerWidth - margin) left = window.innerWidth - margin - tipW / 2;
                                tooltip.style.left = left + 'px';
                                tooltip.style.top = y + 'px';
                            }

                            function showAt(feature, x, y) {
                                if (!feature) { hideTooltip(); return; }
                                if (feature !== current) {
                                    current = feature;
                                    tooltipTitle.textContent = feature.getAttribute('aria-label');
                                }
                                tooltip.hidden = false;
                                if (marker) marker.hidden = false;
                                positionAt(x, y);
                            }

                            function hideTooltip() {
                                tooltip.hidden = true;
                                if (marker) marker.hidden = true;
                                current = null;
                            }

                            // A feature is any labelled element inside the map (not the map itself).
                            function featureFrom(e) {
                                const t = e.target;
                                return (t && t !== map && t.getAttribute && t.getAttribute('aria-label')) ? t : null;
                            }

                            // Every platform: a click / tap (mouse click, touch tap, TalkBack
                            // double-tap) shows the pill at the tap point. Click coexists with
                            // explore-by-touch — the map's existing click handler always did — so
                            // this is the touch-safe trigger that doesn't disturb TalkBack.
                            map.addEventListener('click', function (e) {
                                const f = featureFrom(e); if (f) showAt(f, e.clientX, e.clientY);
                            });

                            // Desktop pointer + keyboard. Gated to hover-capable devices so no
                            // pointer/focus wiring attaches on touch — that is what broke TalkBack
                            // explore-by-touch on Android.
                            if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
                                // Mouse: show on entering a feature, at the pointer. Sticky — it
                                // stays put until Esc, or a different feature replaces it.
                                map.addEventListener('pointerover', function (e) {
                                    if (e.pointerType !== 'mouse') return;
                                    const f = featureFrom(e);
                                    if (f) showAt(f, e.clientX, e.clientY);
                                });
                                // Keyboard focus has no pointer — anchor to the feature's box.
                                map.addEventListener('focusin', function (e) {
                                    const f = featureFrom(e);
                                    if (!f) return;
                                    const r = f.getBoundingClientRect();
                                    showAt(f, r.left + r.width / 2, r.top);
                                });
                            }

                            // Sticky: only Esc (or a different feature) clears it.
                            document.addEventListener('keydown', function (e) {
                                if (e.key === 'Escape' && !tooltip.hidden) hideTooltip();
                            });

                            // Avoid a stale position if the map re-lays-out.
                            window.addEventListener('resize', function () { if (!tooltip.hidden) hideTooltip(); });
                        }

                        // ---------- Map-owned pinch / Ctrl+wheel zoom ----------
                        // Take over pinch so the browser never zooms the whole page: zoom only the
                        // SVG (a CSS transform), keeping the page — and the pointer-anchored,
                        // position:fixed tooltip — at scale 1. touch-action:none on #map (CSS)
                        // routes two-finger pinches here instead of to the browser.
                        function setupZoom() {
                            const map = document.querySelector('#map');
                            if (!map) return;
                            let zoom = 1, panX = 0, panY = 0;
                            const MIN = 1, MAX = 8;

                            function applyTransform() {
                                map.style.transformOrigin = '0 0';
                                map.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + zoom + ')';
                            }

                            // Zoom by ratio k about a focal screen point (fx, fy), keeping it fixed.
                            function zoomAt(k, fx, fy) {
                                const newZoom = Math.max(MIN, Math.min(MAX, zoom * k));
                                const realK = newZoom / zoom;
                                if (realK === 1) return;
                                const rect = map.getBoundingClientRect();
                                panX += (fx - rect.left) * (1 - realK);
                                panY += (fy - rect.top) * (1 - realK);
                                zoom = newZoom;
                                if (zoom === 1) { panX = 0; panY = 0; }  // snap to origin at 1:1
                                applyTransform();
                            }

                            // Trackpad pinch / Ctrl+wheel arrives as a wheel event with ctrlKey set.
                            map.addEventListener('wheel', function (e) {
                                if (!(e.ctrlKey || e.metaKey)) return;
                                e.preventDefault();
                                zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
                            }, { passive: false });

                            // Two-finger touch pinch.
                            let pinching = false, lastDist = 0;
                            map.addEventListener('touchstart', function (e) {
                                if (e.touches.length === 2) {
                                    pinching = true;
                                    lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                                                          e.touches[0].clientY - e.touches[1].clientY);
                                }
                            }, { passive: true });
                            map.addEventListener('touchmove', function (e) {
                                if (!pinching || e.touches.length !== 2) return;
                                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                                                        e.touches[0].clientY - e.touches[1].clientY);
                                const fx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                                const fy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                                if (lastDist > 0) zoomAt(dist / lastDist, fx, fy);
                                lastDist = dist;
                                if (e.cancelable) e.preventDefault();
                            }, { passive: false });
                            map.addEventListener('touchend', function (e) {
                                if (e.touches.length < 2) { pinching = false; lastDist = 0; }
                            });

                            // ----- Button / keyboard zoom + pan (switch, voice, keyboard, pointer) -----
                            const PAN_STEP = 80;
                            function announce(msg) {
                                const lr = document.getElementById('liveRegion');
                                if (lr) lr.textContent = msg;
                            }
                            // Buttons/keys have no pointer focal, so zoom about the map centre.
                            function zoomByCentred(factor) {
                                const r = map.getBoundingClientRect();
                                zoomAt(factor, r.left + r.width / 2, r.top + r.height / 2);
                                announce('Zoom ' + Math.round(zoom * 100) + ' percent');
                            }
                            function panBy(dx, dy) { panX += dx; panY += dy; applyTransform(); }
                            function resetView() { zoom = 1; panX = 0; panY = 0; applyTransform(); announce('Map view reset'); }

                            function wire(id, fn) { const b = document.getElementById(id); if (b) b.addEventListener('click', fn); }
                            wire('zoomIn',    function () { zoomByCentred(1.25); });
                            wire('zoomOut',   function () { zoomByCentred(1 / 1.25); });
                            wire('zoomReset', resetView);
                            wire('panUp',     function () { panBy(0,  PAN_STEP); });
                            wire('panDown',   function () { panBy(0, -PAN_STEP); });
                            wire('panLeft',   function () { panBy( PAN_STEP, 0); });
                            wire('panRight',  function () { panBy(-PAN_STEP, 0); });

                            // Shortcuts, only while focus is within the map so arrow keys keep
                            // scrolling the page everywhere else: +/= zoom in, - out, 0 reset, arrows pan.
                            document.addEventListener('keydown', function (e) {
                                if (!(document.activeElement === map || map.contains(document.activeElement))) return;
                                switch (e.key) {
                                    case '+': case '=': zoomByCentred(1.25);     e.preventDefault(); break;
                                    case '-': case '_': zoomByCentred(1 / 1.25); e.preventDefault(); break;
                                    case '0':           resetView();             e.preventDefault(); break;
                                    case 'ArrowUp':     panBy(0,  PAN_STEP);      e.preventDefault(); break;
                                    case 'ArrowDown':   panBy(0, -PAN_STEP);      e.preventDefault(); break;
                                    case 'ArrowLeft':   panBy( PAN_STEP, 0);      e.preventDefault(); break;
                                    case 'ArrowRight':  panBy(-PAN_STEP, 0);      e.preventDefault(); break;
                                }
                            });
                        }

                        // ---------- F6 / Shift+F6: cycle focus between the controls and the map ----------
                        // Ported from the terminal map. Lets keyboard users jump straight between the
                        // control sidebar and the map without tabbing through everything; each region
                        // remembers where focus last was. The SVG carries tabindex="-1" so it can be
                        // the map's focus target when no feature is tabbable (rotor = none).
                        function setupF6() {
                            const REGIONS = [
                                { id: 'controls', name: 'Map controls',
                                  root: function () { return document.querySelector('.rightSideBar'); },
                                  fallback: function () { return document.getElementById('checkboxBuildings'); } },
                                { id: 'map', name: 'Map',
                                  root: function () { return document.getElementById('mapSection'); },
                                  fallback: function () {
                                      return document.querySelector('#map [tabindex]:not([tabindex="-1"])')
                                          || document.getElementById('map');
                                  } }
                            ];
                            const FOCUSABLE = 'a[href],button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex]:not([tabindex="-1"])';
                            const lastInRegion = Object.create(null);

                            function regionOf(el) {
                                if (!el) return null;
                                for (const r of REGIONS) { const root = r.root(); if (root && root.contains(el)) return r; }
                                return null;
                            }
                            function usable(el) {
                                if (!el || el.disabled) return false;
                                if (el.getAttribute && el.getAttribute('tabindex') === '-1') return false;
                                if (el.offsetParent === null && getComputedStyle(el).position !== 'fixed') return false;
                                return true;
                            }
                            function firstIn(root) {
                                if (!root) return null;
                                const c = root.querySelectorAll(FOCUSABLE);
                                for (const el of c) { if (usable(el)) return el; }
                                return null;
                            }
                            function announce(msg) {
                                const lr = document.getElementById('liveRegion');
                                if (lr) lr.textContent = msg;
                            }

                            document.addEventListener('focusin', function (e) {
                                const r = regionOf(e.target);
                                if (r) lastInRegion[r.id] = e.target;
                            });

                            function cycle(dir) {
                                const here = regionOf(document.activeElement);
                                const start = here ? REGIONS.indexOf(here) : -1;
                                const len = REGIONS.length;
                                const next = REGIONS[((start + dir) % len + len) % len];
                                let target = lastInRegion[next.id];
                                if (!target || !document.contains(target) || !usable(target)) {
                                    target = next.fallback() || firstIn(next.root());
                                }
                                if (!target) return;
                                try { target.focus(); } catch (_) { return; }
                                announce('Moved to ' + next.name + '.');
                            }

                            document.addEventListener('keydown', function (e) {
                                if (e.key !== 'F6') return;
                                e.preventDefault();
                                cycle(e.shiftKey ? -1 : 1);
                            });
                        }

                        function pointInPolygon(polygon, point) {
                            let odd = false;
                            for (let i = 0, j = polygon.length - 1; i < polygon.length; i++) {
                                if (((polygon[i][1] > point[1]) !== (polygon[j][1] > point[1]))
                                    && (point[0] < ((polygon[j][0] - polygon[i][0]) * (point[1] - polygon[i][1]) / (polygon[j][1] - polygon[i][1]) + polygon[i][0]))) {
                                    odd = !odd;
                                }
                                j = i;
                            }
                            return odd;
                        }

                        ///////////////////////////////////////////////////////
                        // Amenity Mappings
                        ///////////////////////////////////////////////////////

                        function createAmenityMappings() {
                            const amenityFeatures = amenityPoints.features;
                            amenityFeatures.forEach(feature => {
                                const properties = feature.properties;

                                if (properties.highway === 'traffic_signals') {
                                    const id = properties.osm_id;
                                    const geom = feature.geometry;
                                    if (geom.type === 'Point') {
                                        const coords = geom.coordinates;
                                        const ts = new TrafficSignal(id, coords[0], coords[1]);
                                    }
                                }

                                if (properties.highway === 'bus_stop') {
                                    const id = properties.osm_id;
                                    const operator = properties.operator;
                                    const publicTransport = properties.public_transport;
                                    const shelter = properties.shelter;
                                    const bus = properties.bus;
                                    const network = properties.network;
                                    const network_wikidata = properties["network:wikidata"];
                                    const network_wikipedia = properties["network:wikipedia"];
                                    const trafficSignals = properties.traffic_signals;
                                    const name = properties.name;
                                    const wheelchair = properties.wheelchair;
                                    const routeRef = properties.route_ref;
                                    const wheelchairDescription = properties["wheelchair:description"];
                                    const tram = properties.tram;
                                    const ref = properties.ref;

                                    const geom = feature.geometry;
                                    if (geom.type === 'Point') {
                                        const coords = geom.coordinates;
                                        const ts = new BusStop(id, coords[0], coords[1], operator, publicTransport, shelter, bus, network, network_wikidata, network_wikipedia, trafficSignals, name, wheelchair, routeRef, wheelchairDescription, tram, ref);
                                    }
                                }

                                if (properties.shop !== null) {
                                    const id = properties.osm_id;
                                    const type = properties.shop;
                                    const houseNumber = properties["addr:housenumber"];
                                    const name = properties.name;
                                    const city = properties["addr:city"];
                                    const street = properties["addr:street"];
                                    const openingHours = properties.opening_hours;
                                    const takeaway = properties.takeaway;
                                    const dispensing = properties.dispensing;
                                    const healthcare = properties.healthcare;
                                    const beauty = properties.beauty;
                                    const website = properties.website;
                                    const healthcareSpeciality = properties["healthcare:speciality"];
                                    const postcode = properties["addr:postcode"];
                                    const phone = properties.phone;
                                    const unit = properties["addr:unit"];
                                    const province = properties["addr:province"];
                                    const outdoorSeating = properties.outdoor_seating;
                                    const delivery = properties.delivery;

                                    const geom = feature.geometry;
                                    if (geom.type === 'Point') {
                                        const coords = geom.coordinates;
                                        const shop = new Shop(id, coords[0], coords[1], type, houseNumber, name, city, street, openingHours, takeaway, dispensing, healthcare, beauty, website, healthcareSpeciality, postcode, phone, unit, province, outdoorSeating, delivery);

                                    }
                                }

                            });
                        }

                        ///////////////////////////////////////////////////////////////
                        // Building Mappings
                        ///////////////////////////////////////////////////////////////
                        function createBuildingMappings() {
                            const buildingFeatures = buildings.features;
                            buildingFeatures.forEach(feature => {
                                const properties = feature.properties;
                                const type = properties.building;
                                const houseNumber = properties["addr:housenumber"];
                                const name = properties.name;
                                const operator = properties.operator;
                                const sport = properties.sport;
                                const leisure = properties.leisure;
                                const city = properties["addr:city"];
                                const street = properties["addr:street"];
                                const postcode = properties["addr:postcode"];
                                const socialFacility = properties.social_facility;
                                const phone = properties.phone;
                                const socialFacilityFor = properties["social_facility:for"];

                                const geom = feature.geometry;
                                let coords;
                                if (geom.type === 'Polygon') {
                                    const id = properties.osm_id;
                                    coords = geom.coordinates;
                                    const building = new Building(id, coords, type, houseNumber, name, operator, sport, leisure, city, street, postcode, socialFacility, phone, socialFacilityFor);
                                }
                            });
                        }


                        ///////////////////////////////////////////////////////////////
                        // Address Mappings
                        ///////////////////////////////////////////////////////////////
                        function createAddressMappings() {
                            const addressFeatures = addresses.features;
                            addressFeatures.forEach(feature => {

                                const properties = feature.properties;
                                const id = properties.osm_id;
                                const unit = properties["addr:unit"];
                                const houseNumber = properties["addr:housenumber"];
                                const street = properties["addr:street"];
                                const city = properties["addr:city"];
                                const postcode = properties["addr:postcode"];
                                const phone = properties.phone;

                                const geom = feature.geometry;
                                if (geom.type === 'Point') {
                                    const coords = geom.coordinates;
                                    const addr = new Address(id, coords[0], coords[1], unit, houseNumber, city, street, postcode, phone);
                                }

                            });
                        }


                        ///////////////////////////////////////////////////////////////
                        // Road Mappings
                        ///////////////////////////////////////////////////////////////
                        function createRoadMappings() {
                            const roadFeatures = roads.features;
                            roadFeatures.forEach(feature => {

                                const properties = feature.properties;
                                const id = properties.osm_id;
                                const type = properties.highway;
                                const name = properties.name;
                                const oneway = properties.oneway;
                                const service = properties.service;
                                const foot = properties.foot;
                                const motorcar = properties.motorcar;
                                const bicycle = properties.bicycle;
                                const footway = properties.footway;
                                const maxspeed = properties.maxspeed;
                                const lanes = properties.lanes;
                                const sidewalk = properties.sidewalk;

                                const geom = feature.geometry;
                                if (geom.type === 'LineString') {
                                    const coords = geom.coordinates;
                                    const road = new Road(id, coords, type, name, oneway, service, foot, motorcar, bicycle, footway, maxspeed, lanes, sidewalk);
                                }

                            });
                        }

                        function onLoad() {


                            const map = document.querySelector("#map");
                            map.addEventListener("click", Geometry.mouseToMapOnClick);

                            const headerHt = 0;

                            let ht;
                            const main = document.querySelector("main");
                            if (window.innerHeight > window.innerWidth) {
                                // Portrait
                                ht = window.innerHeight - headerHt - 70;
                                main.style.flexDirection = 'column';
                            }
                            else {
                                // landscape
                                const searchHt = 300;
                                ht = Math.max((window.innerHeight - headerHt - 20), searchHt);
                            }

                            let dummyDiv = document.querySelector("#dummyDiv");
                            const mapWidth = dummyDiv.offsetWidth;
                            map.setAttribute("width", mapWidth);
                            map.setAttribute("height", ht);
                            map.setAttribute("viewBox", "0 0 " + mapWidth + " " + ht);


                            window.onresize = MapDrawing.resizeMap;

                            createAddressMappings();
                            createAmenityMappings();
                            createBuildingMappings();
                            createRoadMappings();

                        }
                        //]]>
                    </script>
